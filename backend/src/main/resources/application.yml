server:
  port: 8080

spring:
  application:
    name: agriculture-backend
  datasource:
    url: jdbc:mysql://localhost:3306/agriculture?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

ai:
  service:
    url: http://localhost:8000

jwt:
  secret: agriculture-backend-jwt-secret-key-2026-yunnan
  expiration: 86400000
